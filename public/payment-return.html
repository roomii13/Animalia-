<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f5ef">
    <title>Estado del aporte — Animalia</title>
    <style>
      :root { color-scheme: light; --green: #31563a; --ink: #26392c; --muted: #718075; --paper: #f8f5ef; --orange: #f2a128; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(100%, 560px); padding: clamp(24px, 7vw, 44px); border: 1px solid #e0e7dc; border-radius: 24px; background: #fff; }
      h1 { margin: 0 0 12px; color: var(--green); font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; }
      p { color: var(--muted); }
      a { display: inline-flex; min-height: 46px; align-items: center; padding: 10px 16px; border-radius: 13px; background: var(--green); color: white; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 20px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Volvé a Animalia para revisar el aporte</h1>
      <p id="message">Mercado Pago nos devolverá a esta página. La confirmación definitiva llega por una notificación segura y se refleja en el historial de aportes de la app.</p>
      <a href="/about">Conocer Animalia</a>
      <small>Creada por ROMI CELIS</small>
    </main>
    <script>
      const result = new URLSearchParams(location.search).get('result');
      const messages = {
        success: ['Regresaste de Mercado Pago', 'La app confirmará el estado del aporte cuando reciba y verifique la notificación del servidor.'],
        pending: ['Aporte en proceso', 'La app actualizará el estado cuando reciba y verifique la notificación del servidor.'],
        failure: ['El aporte no se completó', 'Podés volver a Animalia e iniciar un nuevo intento cuando quieras.'],
      };
      if (messages[result]) {
        document.getElementById('title').textContent = messages[result][0];
        document.getElementById('message').textContent = messages[result][1];
      }
    </script>
  </body>
</html>
